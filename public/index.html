<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>VPS Monitor</title><style>body{margin:0;background:#080b12;color:#e8eef7;font:15px system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{margin:0 0 6px}.sub{color:#8693a8;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#111824;border:1px solid #263448;border-radius:14px;padding:20px}.head{display:flex;justify-content:space-between}.dot{color:#41e38a}.off{color:#ff6b6b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stat{background:#182333;padding:12px;border-radius:9px}.v{font-size:24px;font-weight:700}.k{color:#8e9db1;font-size:12px;text-transform:uppercase}small{color:#8190a4}@media(max-width:500px){main{padding:16px}}</style><main><h1>MONITORING NODE</h1><div class=sub>VPS infrastructure overview · refresh 5s</div><section id=nodes class=grid></section></main><script>const f=v=>v==null?'—':v;async function load(){const a=await fetch('/api/nodes').then(r=>r.json());nodes.innerHTML=a.length?a.map(n=>`<article class=card><div class=head><b>${n.name}</b><b class=${n.online?'dot':'off'}>${n.online?'● ONLINE':'● OFFLINE'}</b></div><div class=stats>${[['CPU',n.cpu+'%'],['RAM',n.ram+'%'],['DISK',n.disk+'%'],['LOAD',n.load?.map(x=>x.toFixed(2)).join(' / ')],['UPTIME',Math.floor(n.uptime/86400)+'d '+Math.floor(n.uptime%86400/3600)+'h'],['LATENCY',f(n.latency)+(n.latency==null?'':' ms')],['DOWNLOAD',f(n.download)+(n.download==null?'':' Mbps')],['UPLOAD',f(n.upload)+(n.upload==null?'':' Mbps')]].map(x=>`<div class=stat><div class=k>${x[0]}</div><div class=v>${x[1]}</div></div>`).join('')}</div><small>Last update: ${new Date(n.received).toLocaleString()}</small></article>`).join(''):'<div class=card>Belum ada agent terhubung.</div>'}load();setInterval(load,5000)</script>
